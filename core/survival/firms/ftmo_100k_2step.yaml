# FTMO $100k 2-Step Challenge
# Phase 1: 10% target | Phase 2: 5% target | 5% max daily loss (equity-based,
# midnight CET snapshot, floating PnL counts) | 10% static max total loss |
# min 4 trading days per phase | no time limit | funded split 80%.
name: "FTMO 100k 2-Step"
account_size: 100000
currency: "USD"
challenge_fee: 540

daily_loss_pct: 5.0
daily_anchor: "equity"          # midnight-CET equity snapshot (balance == equity at midnight when flat)
max_total_loss_pct: 10.0
timezone: "Europe/Prague"       # CET/CEST daily reset

phases:
  - name: "phase1"
    profit_target_pct: 10.0
    min_trading_days: 4
    max_days: null              # no time limit
  - name: "phase2"
    profit_target_pct: 5.0
    min_trading_days: 4
    max_days: null

funded:
  profit_split: 0.80
  payout_every_days: 21         # ~monthly payout cadence in trading days
  horizon_days: 126             # ~6 months funded simulated for EV per attempt
  fee_refund_on_first_payout: true

sim_max_days_per_phase: 750
