[project]
name = "serpent-lab"
version = "2.0.0"
description = "Serpent Lab v2 - quantitative research and portfolio management system for prop-firm trading EAs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "numba>=0.58",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "hmmlearn>=0.3",
    "pyarrow>=14.0",
    "zstandard>=0.22",
    "vectorbt>=0.26",
    "riskfolio-lib>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
